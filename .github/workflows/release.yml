name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Stable tags share a publication branch; serialize releases without cancelling them.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify tag belongs to source
        run: |
          git fetch origin source
          git merge-base --is-ancestor HEAD origin/source
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import assert from 'node:assert/strict'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'))
          assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*)?$/, 'Use a stable or prerelease SemVer without build metadata')
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`, 'Tag must match package.json version')
          assert.equal(lock.version, pkg.version, 'Lockfile version must match')
          assert.equal(lock.packages[''].version, pkg.version, 'Lockfile root version must match')
          JS
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Pack and verify the published contents
        run: |
          npm pack --json > pack-result.json
          node --input-type=module <<'JS'
          import { readFileSync, renameSync } from 'node:fs'
          import assert from 'node:assert/strict'
          const [pack] = JSON.parse(readFileSync('pack-result.json', 'utf8'))
          const required = [
            'lib/plugin.js', 'lib/slots/index.js', 'lib/node/index.js', 'lib/android/index.js',
            'cordis.patch.yml', 'package.json', 'README.md', 'LICENSE',
            ...['', 'slots/', 'node/', 'android/'].flatMap(prefix =>
              ['icon.svg', 'locale/en.json', 'locale/zh.json'].map(path => prefix + path)),
          ]
          for (const path of required) {
            assert.ok(pack.files.some(file => file.path === path), `Missing release file: ${path}`)
          }
          for (const prefix of ['node/skills/', 'android/skills/']) {
            assert.ok(pack.files.some(file => file.path.startsWith(prefix) && file.path.endsWith('/SKILL.md')), `Missing release skills: ${prefix}`)
          }
          const allowed = ['lib', 'package.json', 'README.md', 'LICENSE', 'cordis.patch.yml', 'icon.svg', 'locale', 'slots', 'node', 'android']
          for (const file of pack.files) {
            assert.ok(allowed.includes(file.path.split('/')[0]), `Unexpected release file: ${file.path}`)
          }
          assert.match(pack.filename, /^satellite-[0-9A-Za-z.-]+\.tgz$/)
          renameSync(pack.filename, 'release.tgz')
          JS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Retries synchronize the original published asset, never replace it.
            gh release download "$RELEASE_TAG" --pattern release.tgz \
              --output release.tgz --clobber
          else
            gh release create "$RELEASE_TAG" release.tgz \
              --verify-tag --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
      - name: Synchronize stable release to main
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: node scripts/publish-main.mjs release.tgz
