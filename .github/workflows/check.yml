name: check

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  verify:
    # Pin the POSIX toolchain layout required by the Local Git security checks.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify trusted POSIX toolchain
        run: |
          node --input-type=module <<'DIAGNOSTICS'
          import { lstat, realpath } from 'node:fs/promises'
          for (const path of ['/usr/bin/env', '/usr/bin/git']) {
            const stat = await lstat(path)
            const resolved = await realpath(path)
            console.log(JSON.stringify({ path, resolved, symlink: stat.isSymbolicLink(), regularFile: stat.isFile() }))
            if (!stat.isFile() || stat.isSymbolicLink() || resolved !== path) {
              throw new Error(`Local Git requires a canonical regular executable: ${path} -> ${resolved}`)
            }
          }
          DIAGNOSTICS
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test (builds, then runs against lib/)
        run: npm test
